name: Update Profile SVG

on:
  schedule:
    - cron: '0 2 * * *'   # runs daily at 02:00 UTC
  push:
    branches: [main]
    paths: [generate_final.py]  # also regenerate when script itself changes
  workflow_dispatch:           # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      # Both themes are committed: profile.svg (metis) is the one README shows,
      # profile-claude.svg is the warm variant.
      - name: Generate both themes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROFILE_THEME=metis  python generate_final.py
          cp profile.svg profile-metis.svg
          PROFILE_THEME=claude python generate_final.py
          mv profile.svg profile-claude.svg
          mv profile-metis.svg profile.svg

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg profile-claude.svg
          git diff --cached --quiet || git commit -m "auto: update profile themes (star counts refreshed)"
          git push
