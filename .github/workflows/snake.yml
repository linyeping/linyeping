name: Generate Contribution Snake

# Renders the GitHub contribution grid as an animated snake.
# Output is committed to the `snake/` directory on main, which README.md and
# generate_final.py both reference by raw URL.
# Docs: https://github.com/Platane/snk

on:
  schedule:
    - cron: '17 1 * * *'   # daily, off the hour to avoid the Actions rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit snake SVGs to main
        run: |
          mkdir -p snake
          cp dist/*.svg snake/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake
          git diff --cached --quiet || git commit -m "auto: update contribution snake"
          git push
